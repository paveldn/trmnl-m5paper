name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          FW_VERSION_VALUE: ${{ github.event.inputs.version }}
        run: |
          pio run

      - name: Generate Release Notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: v${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          previous_tag="$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "$RELEASE_TAG" \
            | head -n 1)"

          if [[ -z "$previous_tag" ]]; then
            echo "No previous stable release tag found; GitHub will generate notes from the repository history."
          else
            echo "Using previous stable release tag: $previous_tag"
          fi

          python scripts/generate_release_notes.py \
            --current-tag "$RELEASE_TAG" \
            --previous-tag "$previous_tag" \
            --output release-notes.md \
            --title "$RELEASE_TAG"

      - name: Prepare Device Asset
        run: |
          mkdir -p dist
          cp .pio/build/m5stack_paper/firmware.bin dist/m5paper.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body_path: release-notes.md
          files: |
            dist/m5paper.bin
