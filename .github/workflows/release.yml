name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          FW_VERSION_VALUE: ${{ github.event.inputs.version }}
        run: |
          pio run --project-option "build_flags=-DBOARD_HAS_PSRAM -DENABLE_SERVER_LOGS -DFW_VERSION=\"$FW_VERSION_VALUE\""

      - name: Prepare Device Asset
        run: |
          mkdir -p dist
          cp .pio/build/m5stack_paper/firmware.bin dist/m5paper.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/m5paper.bin
