name: Prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version (e.g. 2.6.0)"
        required: true

concurrency:
  group: prerelease-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compute Prerelease Name
        id: naming
        shell: bash
        env:
          BASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$BASE_VERSION'. Expected format: x.y.z" >&2
            exit 1
          fi

          next=1
          escaped_base="${BASE_VERSION//./\\.}"
          while read -r _ ref; do
            tag="${ref#refs/tags/}"
            if [[ "$tag" =~ ^v${escaped_base}-beta\.([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              if (( n >= next )); then
                next=$((n + 1))
              fi
            fi
          done < <(git ls-remote --tags --refs origin "refs/tags/v${BASE_VERSION}-beta.*")

          tag_name="v${BASE_VERSION}-beta.${next}"
          release_name="v${BASE_VERSION} beta ${next}"
          firmware_version="${BASE_VERSION}-beta.${next}"

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "firmware_version=${firmware_version}" >> "$GITHUB_OUTPUT"

          echo "Using tag: ${tag_name}"
          echo "Using name: ${release_name}"
          echo "Using FW_VERSION: ${firmware_version}"

      - name: Build
        env:
          FW_VERSION_VALUE: ${{ steps.naming.outputs.firmware_version }}
        run: |
          pio run

      - name: Generate Prerelease Notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.naming.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.naming.outputs.release_name }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          previous_tag="$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' \
            | grep -vx "$RELEASE_TAG" \
            | head -n 1)"

          if [[ -z "$previous_tag" ]]; then
            echo "No previous tag found; GitHub will generate notes from the repository history."
          else
            echo "Using previous tag: $previous_tag"
          fi

          python scripts/generate_release_notes.py \
            --current-tag "$RELEASE_TAG" \
            --previous-tag "$previous_tag" \
            --output release-notes.md \
            --title "$RELEASE_NAME"

      - name: Prepare Device Asset
        run: |
          mkdir -p dist
          cp .pio/build/m5stack_paper/firmware.bin dist/m5paper.bin

      - name: Create Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.naming.outputs.tag_name }}
          name: ${{ steps.naming.outputs.release_name }}
          prerelease: true
          body_path: release-notes.md
          files: |
            dist/m5paper.bin
