; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack_paper]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack_paper
framework = arduino
custom_app_version = 2.7.1
extra_scripts = pre:scripts/pio_set_ota_repo.py
lib_deps = 
	bblanchon/ArduinoJson@^7
	m5stack/M5Unified@0.2.28
	m5stack/M5GFX@0.2.35
monitor_speed = 115200
build_flags = 
	-DBOARD_HAS_PSRAM
	-DTRMNL_M5PAPER
	-DFW_VERSION=\"${this.custom_app_version}\"
	-DDEVICE_MODEL=\"m5paper\"
	-DOTA_FIRMWARE_ASSET_NAME=\"m5paper.bin\"
	-DDEFAULT_EPD_MODE=epd_mode_t::epd_quality

[env:paperdiy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
custom_app_version = 2.7.1
extra_scripts = pre:scripts/pio_set_ota_repo.py
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
	bblanchon/ArduinoJson@^7
	m5stack/M5Unified@0.2.28
	m5stack/M5GFX@0.2.35
	https://github.com/m5stack/M5PM1.git#315d2899c863ae34b59197392b9f4c59490751ef
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DTRMNL_PAPERDIY
	-DFW_VERSION=\"${this.custom_app_version}\"
	-DDEVICE_MODEL=\"paperdiy\"
	-DOTA_FIRMWARE_ASSET_NAME=\"paperdiy.bin\"
	-DDEFAULT_EPD_MODE=epd_mode_t::epd_quality
